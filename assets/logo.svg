<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- BPKP Official Color Palette -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1C48"/>   <!-- BPKP Deep Navy -->
      <stop offset="55%" stop-color="#1F3A8B"/>  <!-- BPKP Medium Blue -->
      <stop offset="100%" stop-color="#3B5FC7"/> <!-- BPKP Light Blue -->
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5232B"/>   <!-- BPKP Official Red -->
      <stop offset="100%" stop-color="#F14249"/> <!-- BPKP Light Red -->
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.4">
      <stop offset="0%" stop-color="#E5232B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E5232B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0B1C48" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square with BPKP gradient -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bg)"/>
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#glow)"/>
  <rect x="8" y="8" width="184" height="184" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Inner ring accent (top-right badge) - BPKP RED -->
  <circle cx="148" cy="52" r="20" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.95"/>
  <circle cx="148" cy="52" r="11" fill="url(#accent)"/>
  <!-- White checkmark in red badge -->
  <path d="M142 52 l5 5 l9 -9" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main icon: combined door (building) + car silhouette -->
  <g transform="translate(40, 48)" filter="url(#shadow)">
    <!-- Body of combined icon: rounded rectangle representing door/building -->
    <rect x="0" y="6" width="80" height="98" rx="18" fill="none" stroke="url(#car)" stroke-width="6"/>
    <!-- Top of door -->
    <rect x="14" y="20" width="52" height="8" rx="3" fill="#ffffff" opacity="0.88"/>
    <!-- Door handle -->
    <circle cx="58" cy="70" r="4" fill="#ffffff"/>
    <!-- Left pillar line -->
    <line x1="22" y1="32" x2="22" y2="96" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.78"/>

    <!-- Car silhouette on bottom - BPKP RED body -->
    <g transform="translate(6, 78)">
      <!-- Car roof -->
      <path d="M16 20 Q20 2 40 2 Q60 2 64 20 L72 22 L72 36 L8 36 L8 22 Z"
            fill="url(#accent)" opacity="0.98"/>
      <!-- Windshield line -->
      <line x1="24" y1="20" x2="24" y2="36" stroke="#0B1C48" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <!-- Car body lower -->
      <rect x="2" y="32" width="84" height="10" rx="4" fill="#ffffff"/>
      <!-- Wheels - BPKP NAVY -->
      <circle cx="22" cy="46" r="8" fill="#0B1C48"/>
      <circle cx="22" cy="46" r="3" fill="#ffffff"/>
      <circle cx="66" cy="46" r="8" fill="#0B1C48"/>
      <circle cx="66" cy="46" r="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- Sparkle dots - red + white accents -->
  <circle cx="34" cy="154" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="28" cy="146" r="1.5" fill="url(#accent)" opacity="0.85"/>
  <circle cx="44" cy="160" r="2" fill="#ffffff" opacity="0.65"/>

  <!-- LARAS text at bottom -->
  <text x="100" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">LARAS</text>
</svg>
